<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presentation</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@700&display=swap");
      :root {
        --bg-grey: #191919;
        --card-grey: #303030;
        --bg-blue: #0b0d1d;
        --card-blue: #232534;
        --accent-gold: #faea95;
        --accent-pink: #ff00ff;
        --accent-cyan: #0df1b1;
        --accent-coral: #f6084c;
        --text-white: #e6fef7;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden; /* Prevents scrollbars on the body */
      }
      body {
        font-family: "Inter", sans-serif;
        color: var(--text-white);
        background-color: var(--bg-grey);
        background-image: radial-gradient(var(--card-grey) 1px, transparent 0);
        background-size: 20px 20px;
      }
      #presentation {
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
      }
      .slide {
        height: 100vh;
        width: 100%;
        scroll-snap-align: start;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2em;
        text-align: center;
        box-sizing: border-box;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div id="presentation">{{ content|safe }}</div>
    <script>
      const presentation = document.getElementById("presentation");

      // Keyboard controls for navigation
      document.addEventListener("keydown", (event) => {
        const nextKeys = [" ", "ArrowDown", "ArrowRight"];
        const prevKeys = ["ArrowUp", "ArrowLeft"];

        if (nextKeys.includes(event.key)) {
          event.preventDefault();
          presentation.scrollBy({
            top: window.innerHeight,
            behavior: "smooth",
          });
        } else if (prevKeys.includes(event.key)) {
          event.preventDefault();
          presentation.scrollBy({
            top: -window.innerHeight,
            behavior: "smooth",
          });
        }
      });

      let lastModified = null;
      setInterval(() => {
        fetch(window.location.href, { method: "HEAD" }).then((response) => {
          const newLastModified = response.headers.get("Last-Modified");
          if (lastModified && newLastModified !== lastModified) {
            window.location.reload();
          }
          lastModified = newLastModified;
        });
      }, 1000);
    </script>
  </body>
</html>
