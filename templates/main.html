<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presentation</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=JetBrains+Mono:wght@500;700&display=swap");

      :root {
        --bg-charcoal: #0a0b0a;
        --surface-timber: #181a18;
        --border-moss: #2c2e2c;
        --text-sage: #a1a4a1;
        --text-mist: #e4e6e4;
        --highlight-frost: #f8f9f8;
        --accent-magenta: hsl(343, 93%, 52%);
        
        --grid-unit: 16px;
        --padding-standard: calc(var(--grid-unit) * 1.5); /* 24px */
        --section-gap: calc(var(--grid-unit) * 6); /* 96px */
        --component-gap: calc(var(--grid-unit) * 2); /* 32px */
      }

      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-charcoal);
      }

      body {
        font-family: "Inter", sans-serif;
        font-weight: 400;
        line-height: 1.6;
        color: var(--text-sage);
      }

      #presentation {
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        background-image: 
          linear-gradient(rgba(44, 46, 44, 0.15) 1px, transparent 1px),
          linear-gradient(90deg, rgba(44, 46, 44, 0.15) 1px, transparent 1px);
        background-size: var(--grid-unit) var(--grid-unit);
      }

      .slide {
        height: 100vh;
        width: 100%;
        scroll-snap-align: start;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: var(--section-gap);
        box-sizing: border-box;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-mist);
        margin-top: 0;
      }

      h1 { font-size: 4rem; }
      h2 { font-size: 3rem; }
      h3 { font-size: 2rem; }

      /* Precision Marker */
      h1::after, h2::after, h3::after {
        content: ".";
        color: var(--accent-magenta);
      }

      p {
        font-weight: 300;
        font-size: 1.5rem;
      }

      /* Structured Panel Look */
      .panel {
        border: 1px solid var(--border-moss);
        background-color: var(--bg-charcoal);
        width: 100%;
        box-sizing: border-box;
      }

      .panel-header {
        background-color: var(--surface-timber);
        border-bottom: 1px solid var(--border-moss);
        padding: calc(var(--grid-unit) * 0.5) var(--padding-standard);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .panel-header::before {
        content: "";
        width: 6px;
        height: 6px;
        background-color: var(--accent-magenta);
        border-radius: 50%;
      }

      .panel-label {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.8rem;
        color: var(--text-mist);
      }

      .panel-content {
        padding: var(--padding-standard);
      }

      /* Buttons */
      .btn {
        display: inline-block;
        background-color: var(--text-mist);
        color: var(--bg-charcoal);
        padding: calc(var(--grid-unit) * 0.5) var(--padding-standard);
        border: none;
        border-radius: 2px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 0 var(--accent-magenta);
      }
    </style>
  </head>
  <body>
    <div id="presentation">{{ content|safe }}</div>
    <script>
      const presentation = document.getElementById("presentation");

      // Keyboard controls for navigation
      document.addEventListener("keydown", (event) => {
        const nextKeys = [" ", "ArrowDown", "ArrowRight"];
        const prevKeys = ["ArrowUp", "ArrowLeft"];

        if (nextKeys.includes(event.key)) {
          event.preventDefault();
          presentation.scrollBy({
            top: window.innerHeight,
            behavior: "smooth",
          });
        } else if (prevKeys.includes(event.key)) {
          event.preventDefault();
          presentation.scrollBy({
            top: -window.innerHeight,
            behavior: "smooth",
          });
        }
      });

      let lastModified = null;
      setInterval(() => {
        fetch(window.location.href, { method: "HEAD" }).then((response) => {
          const newLastModified = response.headers.get("Last-Modified");
          if (lastModified && newLastModified !== lastModified) {
            window.location.reload();
          }
          lastModified = newLastModified;
        });
      }, 1000);

      // New script for slide navigation and persistence
      const slides = document.querySelectorAll(".slide");
      slides.forEach((slide, index) => {
        if (!slide.id) {
          slide.id = `slide-${index}`;
        }
      });

      const observerOptions = {
        root: presentation,
        rootMargin: "0px",
        threshold: 0.7, // A slide is considered active when 70% of it is visible
      };

      const slideObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            // Update URL hash when a new slide becomes active
            window.history.replaceState(null, null, `#${entry.target.id}`);
          }
        });
      }, observerOptions);

      slides.forEach((slide) => {
        slideObserver.observe(slide);
      });

      // Scroll to the slide specified in the URL hash on page load
      if (window.location.hash) {
        try {
          const initialSlide = document.querySelector(window.location.hash);
          if (initialSlide) {
            presentation.scrollTo({
              top: initialSlide.offsetTop,
              behavior: "instant", // Use "instant" to avoid smooth scroll on load
            });
          }
        } catch (error) {
          console.error("Error scrolling to initial slide:", error);
        }
      }
    </script>
  </body>
</html>
