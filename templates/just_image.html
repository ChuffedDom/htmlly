<div class="slide just-image-slide">
  {% for arg in args %} {{ arg|safe }} {% endfor %}
</div>

<style>
  .just-image-slide p {
    font-size: 8vh;
  }
  .just-image-slide img {
    width: 90vw; /* Maintains aspect ratio */
    height: auto; /* Maintains aspect ratio */
    max-height: 90vh; /* Ensures it doesn't exceed viewport height */
    object-fit: contain;
    border-radius: clamp(16px, 4vh, 28px);
  }
</style>
