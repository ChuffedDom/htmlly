<div class="slide just-image-slide">
  {% for arg in args %} {{ arg|safe }} {% endfor %}
</div>

<style>
  .just-image-slide p {
    font-size: 8vh;
  }
  .just-image-slide img {
    max-width: 90vw; /* 90% of the viewport width */
    max-height: 80vh; /* 80% of the viewport height */
    width: auto; /* Maintains aspect ratio */
    height: auto; /* Maintains aspect ratio */
    object-fit: contain;
    border-radius: 8vh;
  }
</style>
